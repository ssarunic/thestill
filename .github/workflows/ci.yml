name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Spec #44 — real Postgres (with pgvector) so the dual-backend contract
    # suites run their Postgres cases in CI instead of skipping. The suites
    # skip cleanly when TEST_DATABASE_URL is unset, so local SQLite-only
    # runs are unaffected.
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: thestill_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      # Spec #25 item 3.8: install from the committed uv.lock so CI runs
      # the exact version set we tested with. ``pip install`` against
      # ``>=`` floors would silently pull whatever PyPI has each run,
      # which is the supply-chain ambush vector this lockfile closes.
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install (frozen) with dev + postgres extras
        run: uv sync --frozen --extra dev --extra postgres

      # spec #42 (FM-3): gate the tz-naive-datetime ban (ruff DTZ rules) +
      # the existing print() ban. A tz-naive datetime slipping back in is
      # what silently stopped feed discovery; keep it a build error, not a
      # lint-locally-if-you-remember nicety.
      - name: Lint (ruff — print + tz-naive datetime ban)
        run: uv run ruff check thestill/

      - name: pytest
        # Skip tests/perf/: a separate ``latency`` job runs them so noise on
        # the latency budget doesn't block unrelated unit-test work.
        # TEST_DATABASE_URL activates the Postgres cases of the dual-backend
        # contract suites (spec #44) against the pgvector service above.
        env:
          TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:55432/thestill_test
        run: uv run pytest -q --tb=short --ignore=tests/perf

  latency:
    # Spec #28 Phase 3.3 — per-tool P50/P95 latency budget gate.
    # Runs the same install as ``python`` but only the ``tests/perf/`` suite,
    # which uses a stub embedding model + 10-episode fixture corpus to assert
    # search_corpus / find_mentions / list_quotes_by stay under the spec
    # thresholds (lines 1316–1325) × 1.25 CI tolerance.
    name: Latency budget (spec #28)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install (frozen) with dev + entities extras
        # ``[entities]`` brings sqlite-vec, which the perf fixture needs.
        run: uv sync --frozen --extra dev --extra entities

      - name: pytest tests/perf
        run: uv run pytest tests/perf -v --tb=short

  frontend:
    name: Frontend build + tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: thestill/web/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: thestill/web/frontend/package-lock.json

      - name: npm ci
        run: npm ci

      - name: Tests (vitest)
        run: npm run test:run

      - name: Build (tsc + vite)
        run: npm run build

      # Spec #68 — browser gate. The jsdom suite above cannot see the things
      # that actually broke this app: React Query option merging, per-observer
      # poll timers, and whether an invalidation reaches the painted DOM. These
      # specs stub /api/** and drive the built bundle in a real Chromium.
      # `test:e2e:ci` excludes @live specs, which need a populated backend.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E (playwright)
        run: npm run test:e2e:ci

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            thestill/web/frontend/playwright-report
            thestill/web/frontend/test-results
          retention-days: 7

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans full history, not just the diff. Shallow clones
          # miss anything older than HEAD~1 — pull everything.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz
          sudo mv gitleaks /usr/local/bin/
          gitleaks version

      - name: Run gitleaks
        # ``--redact`` masks any matched secret in logs so a false positive
        # doesn't leak the real value into PR job logs.
        run: gitleaks detect --source . --no-banner --redact --verbose

  docker:
    name: Docker build (slim)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build slim image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: slim
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Spec #66 — publish the AWS deployment image on merges to main.
  #
  # arm64 ONLY. The deployment is a Graviton t4g.medium, so amd64 was never
  # pulled by anything — it just cost wall-clock. Measured 2026-08-07 on the
  # same commit: arm64 3m44s (warm layer cache), amd64 30+ min, because
  # nothing exercises the amd64 cache scope and the x86-64 CPU-torch wheels
  # in the `prod` target are far bulkier than the aarch64 ones. Since a single
  # platform needs no manifest stitching, the push-by-digest + artifact +
  # imagetools dance is gone too: one job, direct tags.
  #
  # To restore multi-arch (spec #66 lists an x86 instance as the fallback if
  # an arm64 wheel ever misbehaves): put `platforms` back to a matrix over
  # native runners — ubuntu-24.04-arm and ubuntu-latest — build with
  # push-by-digest, and merge with `docker buildx imagetools create`.
  #
  # The PR-time `docker` job above stays the fast slim smoke gate; it never
  # pushes.
  docker-publish:
    name: Publish prod image (linux/arm64)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [python, frontend]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          target: prod
          build-args: |
            EXTRAS=postgres,s3,ses,search
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:prod-latest
            ghcr.io/${{ github.repository }}:prod-${{ github.sha }}
          cache-from: type=gha,scope=prod-arm64
          cache-to: type=gha,mode=max,scope=prod-arm64

      - name: Inspect published image
        run: docker buildx imagetools inspect ghcr.io/${{ github.repository }}:prod-latest
