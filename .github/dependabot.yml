version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - python
    # Ceilings pyproject.toml holds on purpose (see the comment next to each
    # pin). Without these, Dependabot reopens a "widen the requirement" PR
    # every time upstream publishes past the ceiling, and the sweep closes
    # it again. Remove the entry in the same PR that lifts the pin.
    # Ignore rules also mute security-update PRs past the ceiling; crossing
    # one of these majors needs a human anyway.
    ignore:
      - dependency-name: "mistralai"
        versions: [">=3.0.0"]
      - dependency-name: "mcp"
        versions: [">=3.0.0"]
      - dependency-name: "whisperx"
        versions: [">=4.0.0"]
      # The commented <6 ReFinED cap in the entities extra. The
      # local-transcription line's upper bound is only Dependabot's last
      # widening, so its "update requirement" PRs below 6 still come through.
      - dependency-name: "transformers"
        versions: [">=6"]
    groups:
      python-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /thestill/web/frontend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - javascript
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch

  # Workflow actions. Without this entry they are never bumped and drift
  # onto deprecated Node runtimes (they sat on node20 until 2026-09).
  # astral-sh/setup-uv publishes no floating major tags since v8, so it is
  # pinned to an exact version and relies on this entry for updates.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Etc/UTC
    labels:
      - dependencies
      - github-actions
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Etc/UTC
    labels:
      - dependencies
      - docker
    ignore:
      # Blocked on pydub / audioop. pydub 0.25.1 still imports audioop,
      # which was removed from CPython stdlib in 3.13. Unblock by adding
      # `audioop-lts; python_version>=3.13` to pyproject.toml first.
      - dependency-name: "python"
        update-types: ["version-update:semver-major"]
